<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Muro Anónimo</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    .top-bar { display: flex; gap: 10px; margin-bottom: 20px; max-width: 500px; }
    input { padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; flex: 1; }
    button { padding: 10px 15px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .item { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: center; width: 220px; }
    .item img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
    .btn-borrar { width: 100%; margin-top: 10px; background: #c0392b; }
  </style>
</head>
<body>

  <h1>Panel de Control (Moderación)</h1>
  <br>
  <div class="top-bar">
    <input type="password" id="adminPass" placeholder="Clave de Administrador">
    <button onclick="cargarGaleriaAdmin()" style="background: #27ae60;">Cargar Fotos</button>
  </div>

  <div class="grid" id="adminGrid"></div>

  <script>
    async function cargarGaleriaAdmin() {
      const pass = document.getElementById('adminPass').value;
      const grid = document.getElementById('adminGrid');

      if (!pass) {
        alert('Ingresa tu clave de administrador para cargar el panel.');
        grid.innerHTML = '';
        return;
      }

      try {
        // Consultamos la ruta privada de administración
        const res = await fetch('/api/admin/fotos', {
          headers: { 'x-admin-password': pass }
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(`Error: ${errData.error || 'Contraseña incorrecta.'}`);
          grid.innerHTML = '';
          return;
        }

        const fotos = await res.json();
        grid.innerHTML = '';

        fotos.forEach(f => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <a href="${f.url}" target="_blank">
              <img src="${f.url}">
            </a>
            <p style="font-size: 12px; margin: 5px 0;">${f.comentario || 'Sin texto'}</p>
            <button class="btn-borrar" onclick="borrarFoto('${f.id}')">Borrar Foto</button>
          `;
          grid.appendChild(div);
        });
      } catch (err) {
        alert('Error al conectar con el servidor.');
      }
    }

    async function borrarFoto(id) {
      const pass = document.getElementById('adminPass').value;
      if (!pass) return alert('Ingresa tu clave de administrador.');

      if (!confirm('¿Seguro que deseas eliminar esta imagen permanentemente?')) return;

      try {
        const res = await fetch(`/api/fotos?id=${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { 
            'x-admin-password': pass,
            'Content-Type': 'application/json'
          }
        });

        if (res.ok) {
          alert('Imagen eliminada.');
          cargarGaleriaAdmin();
        } else {
          const data = await res.json();
          alert(`Error: ${data.error || 'Clave incorrecta o fallo al eliminar.'}`);
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    }
  </script>
</body>
</html>
