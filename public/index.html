<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro Anónimo Escolar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0b10;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      text-align: center;
      padding: 15px;
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .form-container {
      max-width: 400px;
      margin: 10px auto 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="file"], input[type="text"] {
      background: #1a1a24;
      border: 1px solid #33334d;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
    }

    button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #5b4bc4; }

    /* Contenedor del Mural Tipo Collage */
    .mural-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      min-height: 80vh;
      margin: 20px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    /* Estilo de la tarjeta polaroid/foto */
    .foto-card {
      position: relative;
      width: 200px;
      background: #181824;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s ease, z-index 0.3s ease;
      /* Margen negativo para lograr el efecto de encimado tipo solapado */
      margin-left: -40px;
      margin-top: -20px;
      cursor: pointer;
    }

    /* Al pasar el cursor o tocarla, se pone hasta arriba para poder verla bien */
    .foto-card:hover, .foto-card:active {
      z-index: 9999 !important;
      transform: scale(1.15) rotate(0deg) !important;
      box-shadow: 0 15px 35px rgba(108, 92, 231, 0.5);
    }

    .foto-card a {
      display: block;
      text-decoration: none;
    }

    .foto-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      -webkit-user-drag: none;
      pointer-events: auto;
    }

    .foto-card p {
      margin-top: 8px;
      font-size: 13px;
      color: #eee;
      word-wrap: break-word;
      text-align: center;
    }

    .foto-card span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: #888;
      text-align: center;
    }

    @media (max-width: 600px) {
      .foto-card {
        width: 150px;
        margin-left: -25px;
        margin-top: -15px;
      }
      .foto-card img {
        height: 150px;
      }
    }
  </style>
</head>

<body oncontextmenu="return false;" ondragstart="return false;">

  <header>
    <h1>Muro Anónimo</h1>
    <p style="font-size: 12px; color: #aaa;">Toca una foto para ampliarla</p>

    <div class="form-container">
      <input type="file" id="fotoInput" accept="image/*">
      <input type="text" id="comentarioInput" placeholder="Mensaje corto (opcional)..." maxlength="100">
      <button id="btnPublicar" onclick="subirPublicacion()">Publicar en el Mural</button>
    </div>
  </header>

  <main class="mural-container" id="muralContenedor"></main>

  <script>
    window.addEventListener('DOMContentLoaded', cargarMural);

    async function cargarMural() {
      try {
        const res = await fetch('/api/fotos');
        const fotos = await res.json();
        const contenedor = document.getElementById('muralContenedor');
        contenedor.innerHTML = '';

        fotos.forEach((foto, i) => {
          const card = document.createElement('div');
          card.className = 'foto-card';

          // Asigna niveles de profundidad (z-index) y rotaciones aleatorias para estilo collage
          const rotacionAleatoria = (Math.random() * 20 - 10).toFixed(1); // entre -10deg y 10deg
          const zIndexCalculado = fotos.length - i; // Las nuevas quedan encima pero desfasadas

          card.style.transform = `rotate(${rotacionAleatoria}deg)`;
          card.style.zIndex = zIndexCalculado;

          card.innerHTML = `
            <a href="${foto.url}" target="_blank">
              <img src="${foto.url}" loading="lazy" alt="Foto Anónima" oncontextmenu="return false;" ondragstart="return false;">
            </a>
            ${foto.comentario ? `<p>${foto.comentario}</p>` : ''}
            <span>Anónimo • ${foto.fecha}</span>
          `;
          contenedor.appendChild(card);
        });
      } catch (err) {
        console.error('Error al cargar el mural:', err);
      }
    }

    async function subirPublicacion() {
      const fileInput = document.getElementById('fotoInput');
      const comentarioInput = document.getElementById('comentarioInput');
      const btn = document.getElementById('btnPublicar');

      if (!fileInput.files[0]) {
        alert('Selecciona una foto primero.');
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = 'Subiendo...';

      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          const res = await fetch('/api/fotos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              imagenBase64: reader.result,
              comentario: comentarioInput.value
            })
          });

          if (res.ok) {
            fileInput.value = '';
            comentarioInput.value = '';
            cargarMural();
          } else {
            alert('Error al publicar la foto.');
          }
        } catch (error) {
          alert('Error de conexión con el servidor.');
        } finally {
          btn.disabled = false;
          btn.innerText = 'Publicar en el Mural';
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
